import groovy.json.JsonBuilder

plugins {
    alias(libs.plugins.loom)
    alias(libs.plugins.ploceus)
}

def baseVersion = project.version.toString()
def gitOutput = { List<String> args ->
    providers.exec {
        commandLine(['git'] + args)
        ignoreExitValue = true
    }.standardOutput.asText.map { it.trim() }.orElse('')
}
def gitHash = gitOutput(['rev-parse', 'HEAD']).orElse('')
def gitBranch = gitOutput(['rev-parse', '--abbrev-ref', 'HEAD']).orElse('')
def production = providers.gradleProperty('production')
        .orElse(providers.environmentVariable('GITHUB_REF_TYPE').map { it == 'tag' ? 'true' : 'false' })
        .orElse('false')

base {
    archivesName = project.archives_base_name
}
def mcSuffix = "+mc${libs.versions.minecraft.get()}"
version = baseVersion + mcSuffix
group = project.maven_group

sourceSets {
    standalone
    docs {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

repositories {
	maven {
		url = "https://maven.ornithemc.net/releases"
	}
	maven {
		url = 'https://jitpack.io/'
		content {
			includeGroup 'io.github.nevalackin'
		}
	}
}

dependencies {
    minecraft libs.minecraft
	mappings libs.feather
	modImplementation libs.loader

	ploceus.dependOsl(libs.versions.osl.get())
}

processResources {
    def modVersion = version.toString()
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = it.name == 'compileStandaloneJava' ? 8 : 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

def jarVersion = production.get().toBoolean()
        ? baseVersion + mcSuffix
        : "${baseVersion}-${(gitHash.get() ?: 'unknown').take(10)}${mcSuffix}"
afterEvaluate {
    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = jarVersion
    }
}

def generateBuildData = tasks.register('generateBuildData') {
    def output = layout.buildDirectory.file('generated/build-data/ILLUSION_BUILD_DATA')
    def versionValue = baseVersion
    inputs.property 'gitHash', gitHash
    inputs.property 'gitBranch', gitBranch
    inputs.property 'production', production
    inputs.property 'version', versionValue
    outputs.file output

    doLast {
        def fullHash = gitHash.get() ?: 'unknown'
        def json = new JsonBuilder([
            gitBranch   : gitBranch.get() ?: 'unknown',
            gitHash     : fullHash.take(10),
            fullGitHash : fullHash,
            production  : production.get().toBoolean(),
            version     : versionValue
        ])
        output.get().asFile.text = json.toPrettyString() + '\n'
    }
}

jar {
    from generateBuildData
    from sourceSets.standalone.output
    manifest {
        attributes 'Main-Class': 'org.codeberg.illusionclient.Main'
    }

    def archivesName = base.archivesName
    from('LICENSE') {
        rename { "${it}_${archivesName.get()}" }
    }
    from('licenses') {
        into 'licenses'
    }
}

tasks.register('docs', JavaExec) {
    group = 'documentation'
    description = 'Generates the module documentation page.'

    def output = layout.buildDirectory.file('docs/index.html')
    def runDir = layout.buildDirectory.dir('docs-run')
    def docsVersion = version.toString()
    def channel = providers.gradleProperty('channel').orElse('stable')

    inputs.property 'version', docsVersion
    inputs.property 'channel', channel
    outputs.file output

    classpath = sourceSets.docs.runtimeClasspath
    mainClass = 'org.codeberg.illusionclient.docs.DocsGenerator'
    workingDir = runDir
    argumentProviders.add({
        [output.get().asFile.absolutePath, docsVersion, channel.get()]
    } as CommandLineArgumentProvider)

    doFirst { runDir.get().asFile.mkdirs() }
}
